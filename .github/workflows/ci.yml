name: CI
on: [push, pull_request]
jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test -p bridgman-core --locked
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install maturin pytest hypothesis sympy pyright pyyaml
      - name: Rust tests and compile-fail contracts
        shell: bash
        run: PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')" cargo test --workspace
      - run: cargo fmt --all --check
      - run: python tools/generate_profile.py --check
      - run: python tools/test_generate_profile.py
      - name: Build and install wheel
        run: python -m pip install .
      - name: Test installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: python -m pytest "${{ github.workspace }}/tests" -q
      - name: Test installed typing outside checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tools/check_installed.py"
      - run: pyright
      - name: Validate source distribution
        run: maturin sdist --out dist
      - name: Check source archive contents
        shell: bash
        run: python tools/check_sdist.py dist/*.tar.gz
      - name: Rebuild wheel from source distribution
        shell: bash
        run: python -m pip wheel --no-deps dist/*.tar.gz -w rebuilt
