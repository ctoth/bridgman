[project]
name = "bridgman"
version = "0.3.0"
description = "Dimensional analysis arithmetic for SI quantities"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Q", email = "q.alpha@gmail.com" }
]
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project.optional-dependencies]
sympy = ["sympy>=1.0"]

[dependency-groups]
dev = ["pytest", "pyright", "sympy>=1.0", "hypothesis"]

[tool.pyright]
include = ["src/bridgman"]
typeCheckingMode = "basic"

[tool.maturin]
manifest-path = "crates/bridgman-python/Cargo.toml"
python-source = "src"
module-name = "bridgman._core"
features = ["pyo3/abi3-py39"]
include = [
    { path = "profiles/**/*.yml", format = "sdist" },
    { path = "design/**/*.yml", format = "sdist" },
    { path = "tests/**/*.py", format = "sdist" },
    { path = "tests/**/*.yml", format = "sdist" },
    { path = "tools/*.py", format = "sdist" },
    { path = "RUST_REWRITE_PLAN.md", format = "sdist" },
]
