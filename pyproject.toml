[project]
name = "bridgman"
version = "0.2.0"
description = "Dimensional analysis arithmetic for SI quantities"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Q", email = "q.alpha@gmail.com" }
]
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[project.optional-dependencies]
sympy = ["sympy>=1.0"]

[dependency-groups]
dev = ["pytest", "pyright", "sympy>=1.0", "hypothesis"]

[tool.pyright]
include = ["src/bridgman"]
typeCheckingMode = "basic"
