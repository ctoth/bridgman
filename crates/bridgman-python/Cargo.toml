[package]
name = "bridgman-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Private Python extension for Bridgman"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
bridgman-core = { package = "bridgman", path = "../bridgman" }
num-bigint.workspace = true
pyo3 = { workspace = true, features = ["abi3-py39", "generate-import-lib", "num-bigint"] }
